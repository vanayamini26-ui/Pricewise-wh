<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PriceWise: Amazon vs Flipkart for electronics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b1f33; --muted:#52667a; --mist:#eaf0f5; --card:#ffffff; --line:#cbd6e0;
  --blue:#1f4fd8; --green:#0b8a5b; --greenbg:#e3f5ec; --amber:#a14a05; --amberbg:#fdf0dc;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--mist);color:var(--ink);font-family:var(--font);line-height:1.5;
  font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding:32px 20px 64px}
header h1{font-size:2.1rem;font-weight:800;margin:0;letter-spacing:-.02em}
header p{margin:6px 0 24px;color:var(--muted);max-width:60ch}
form{display:flex;gap:10px;flex-wrap:wrap}
input[type=search]{flex:1 1 320px;font:inherit;font-size:1.05rem;padding:14px 16px;border:2px solid var(--line);
  border-radius:10px;background:#fff;color:var(--ink)}
input[type=search]:focus{outline:3px solid #b9c9f7;border-color:var(--blue)}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:14px 22px;cursor:pointer}
.go{background:var(--blue);color:#fff}
.go:disabled{opacity:.6;cursor:progress}
.ghost{background:transparent;color:var(--blue);padding:8px 10px}
button:focus-visible,a:focus-visible{outline:3px solid #b9c9f7;outline-offset:2px}
.hint{margin-top:10px;color:var(--muted);font-size:.92rem}
.hint button{padding:0;background:none;color:var(--blue);font-weight:700;text-decoration:underline;margin-right:12px}
#status{margin:28px 0 12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pill{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.92rem}
.pill b{display:block}
.pill.bad{background:var(--amberbg);border-color:#f0cf9a;color:var(--amber)}
#msg{margin:24px 0;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:10px}
#msg.err{background:var(--amberbg);border-color:#f0cf9a;color:var(--amber)}
.row{display:grid;grid-template-columns:96px 1fr 1fr 1fr;gap:18px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:18px;margin-bottom:14px;align-items:start}
.thumb{width:96px;height:96px;object-fit:contain;background:#fff;border-radius:8px}
.thumb.empty{display:grid;place-items:center;color:var(--muted);font-size:.8rem;background:var(--mist)}
.title{font-weight:700;font-size:1.02rem;margin:0 0 4px}
.sub{color:var(--muted);font-size:.9rem}
.store{border:1px solid var(--line);border-radius:10px;padding:12px;height:100%}
.store.win{border-color:var(--green);background:var(--greenbg)}
.store h3{margin:0;font-size:.95rem;font-weight:700}
.price{font-size:1.5rem;font-weight:800;margin:2px 0}
.tag{display:inline-block;font-size:.78rem;font-weight:700;color:var(--green);margin-left:6px}
.meta{font-size:.85rem;color:var(--muted);margin-bottom:8px}
.listed{font-size:.8rem;color:var(--muted);margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical}
.bar{height:6px;border-radius:3px;background:#d9e2ea;margin:6px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
.win .bar i{background:var(--green)}
.view{display:inline-block;text-decoration:none;font-weight:700;font-size:.9rem;color:#fff;background:var(--ink);
  padding:8px 12px;border-radius:8px}
.na{color:var(--amber);font-weight:700}
.na small{display:block;color:var(--muted);font-weight:500;margin-top:4px}
.diff{grid-column:2 / -1;font-weight:700;border-top:1px dashed var(--line);padding-top:10px}
.diff.win{color:var(--green)}
.diff.none{color:var(--muted);font-weight:500}
.skel{height:150px;border-radius:14px;margin-bottom:14px;background:linear-gradient(90deg,#dde6ee,#f0f4f8,#dde6ee);
  background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.tabs{position:sticky;top:0;z-index:20;display:flex;gap:6px;margin:0 -20px 22px;padding:10px 20px;background:var(--mist);
  border-bottom:1px solid var(--line)}
.tab{flex:1 1 0;min-width:0;background:#fff;color:var(--ink);border:1px solid var(--line);padding:10px 4px;font-size:.88rem;
  white-space:nowrap}
.tab[aria-current=page]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab .n{font-weight:800}
.tcell{display:flex;gap:8px;justify-content:space-between;align-items:flex-start;min-width:0}
.tcell>div{min-width:0}
.heart{flex:none;width:44px;height:44px;padding:0;border-radius:50%;background:#fff;border:1px solid var(--line);
  color:#9aa8b6;font-size:1.35rem;line-height:1}
.heart.on{color:#d6246e;border-color:#f3b4cd;background:#fff0f6}
.wact{grid-column:2 / -1;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.rm{background:#fff;color:var(--amber);border:1px solid #f0cf9a;padding:8px 14px;font-size:.9rem}
.state{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:36px 20px;text-align:center}
.state h2{margin:0 0 6px;font-size:1.15rem}
.state p{margin:0;color:var(--muted)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.ph h2{margin:0;font-size:1.25rem}
.hl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hl button{width:100%;display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;background:#fff;
  color:var(--ink);border:1px solid var(--line);padding:14px 16px;font-weight:600}
.hl button span:first-child{min-width:0;overflow-wrap:anywhere}
.hl small{flex:none;color:var(--muted);font-weight:500}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:#fff;
  padding:12px 16px;border-radius:10px;font-size:.92rem;z-index:40}
html,body{overflow-x:hidden}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
@media (max-width:820px){
  .wrap{padding:20px 16px 56px}
  .tabs{margin:0 -16px 18px;padding:10px 12px;gap:4px}
  .tab{font-size:.8rem;padding:10px 2px}
  header h1{font-size:1.7rem}
  .wact{grid-column:1 / -1}
  .row{grid-template-columns:72px 1fr}
  .thumb{width:72px;height:72px}
  .row .store{grid-column:1 / -1}
  .diff{grid-column:1 / -1}
  #status{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>PriceWise</h1>
    <p>Search a phone, laptop, TV or any other electronic product. PriceWise reads the current listed price from Amazon India and Flipkart at the moment you search.</p>
  </header>

  <nav class="tabs" aria-label="Sections">
    <button class="tab" type="button" data-view="search" aria-current="page">Compare</button>
    <button class="tab" type="button" data-view="wish">❤️ Wishlist <span class="n" id="wl-n"></span></button>
    <button class="tab" type="button" data-view="hist">🕘 History</button>
  </nav>

  <section id="v-search">
  <form id="f" role="search">
    <input id="q" type="search" placeholder="For example: Samsung Galaxy S24 128GB" aria-label="Product name" required minlength="2" autocomplete="off">
    <button class="go" id="go" type="submit">Compare prices</button>
  </form>
  <div class="hint">Try:
    <button type="button" data-q="iPhone 15 128GB">iPhone 15 128GB</button>
    <button type="button" data-q="boAt Rockerz 450">boAt Rockerz 450</button>
    <button type="button" data-q="Logitech MX Master 3S">Logitech MX Master 3S</button>
  </div>

  <div id="status" hidden></div>
  <div id="msg" hidden></div>
  <div id="out" aria-live="polite"></div>
  </section>

  <section id="v-wish" hidden>
    <div class="ph"><h2>❤️ Wishlist</h2></div>
    <div id="wish-out"></div>
  </section>

  <section id="v-hist" hidden>
    <div class="ph"><h2>🕘 Search History</h2><button class="ghost" id="clr" type="button" hidden>Clear History</button></div>
    <div id="hist-out"></div>
  </section>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
const $ = (id) => document.getElementById(id);
const form = $('f'), input = $('q'), go = $('go'), out = $('out'), status = $('status'), msg = $('msg');
const NAMES = { amazon: 'Amazon India', flipkart: 'Flipkart' };
const rupee = (n) => '\u20B9' + Number(n).toLocaleString('en-IN');

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v; else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}
function ago(ts) {
  const s = Math.max(0, Math.round(Date.now() / 1000 - ts));
  return s < 5 ? 'just now' : s < 90 ? s + ' seconds ago' : Math.round(s / 60) + ' minutes ago';
}
function showMsg(text, isErr) { msg.hidden = false; msg.className = isErr ? 'err' : ''; msg.textContent = text; }

function statusPill(key, m) {
  const ok = m.status === 'ok';
  let line;
  if (ok) line = m.checked + ' listings read, ' + m.matched + ' match your search. Fetched ' + ago(m.fetched_at) + '.';
  else if (m.status === 'no_results') line = 'No results returned. Fetched ' + ago(m.fetched_at) + '.';
  else line = m.message || 'Data unavailable.';
  return h('div', { class: 'pill' + (ok || m.status === 'no_results' ? '' : ' bad') },
    h('b', null, NAMES[key] + (ok || m.status === 'no_results' ? '' : ': data unavailable')), line);
}

function storeCell(key, item, note, win, maxPrice) {
  const cell = h('div', { class: 'store' + (win ? ' win' : '') }, h('h3', null, NAMES[key]));
  if (!item) {
    cell.append(h('div', { class: 'na' }, note === 'unavailable' ? 'Data unavailable' : 'No matching listing',
      h('small', null, note === 'unavailable'
        ? 'PriceWise could not retrieve ' + NAMES[key] + ' data for this search.'
        : 'No ' + NAMES[key] + ' result matched this exact variant.')));
    return cell;
  }
  cell.append(h('div', { class: 'price' }, rupee(item.price), win ? h('span', { class: 'tag' }, 'Lower price') : null));
  const meta = [];
  if (item.rating) meta.push(item.rating.toFixed(1) + ' out of 5');
  if (item.reviews) meta.push(item.reviews.toLocaleString('en-IN') + ' ratings');
  cell.append(h('div', { class: 'meta' }, meta.length ? meta.join(', ') : 'Rating not available'));
  const bar = h('div', { class: 'bar', 'aria-hidden': 'true' }, h('i', { style: 'width:' + Math.round(item.price / maxPrice * 100) + '%' }));
  cell.append(bar);
  cell.append(h('div', { class: 'listed', title: item.name }, 'Listed as: ' + item.name));
  cell.append(h('a', { class: 'view', href: item.url, target: '_blank', rel: 'noopener noreferrer' }, 'View on ' + (key === 'amazon' ? 'Amazon' : 'Flipkart')));
  return cell;
}

function renderRow(r, mode) {
  const prices = [r.amazon, r.flipkart].filter(Boolean).map((x) => x.price);
  const maxPrice = Math.max(...prices);
  const thumb = r.image ? h('img', { class: 'thumb', src: r.image, alt: '', loading: 'lazy', referrerpolicy: 'no-referrer' })
                        : h('div', { class: 'thumb empty' }, 'No image');
  let diff;
  if (r.cheaper === 'same') diff = h('div', { class: 'diff none' }, 'Same listed price on both platforms.');
  else if (r.cheaper) diff = h('div', { class: 'diff win' }, rupee(r.difference) + ' cheaper on ' + NAMES[r.cheaper] + '.');
  else diff = h('div', { class: 'diff none' }, 'Price difference not available: only one platform has this variant.');
  return h('article', { class: 'row' },
    thumb,
    h('div', { class: 'tcell' },
      h('div', null, h('p', { class: 'title' }, r.name), r.spec ? h('div', { class: 'sub' }, r.spec) : null),
      heartBtn(r)),
    storeCell('amazon', r.amazon, r.amazon_note, r.cheaper === 'amazon', maxPrice),
    storeCell('flipkart', r.flipkart, r.flipkart_note, r.cheaper === 'flipkart', maxPrice),
    diff,
    mode === 'wish' ? wishActions(r) : null);
}

/* ---------- wishlist ---------- */
const wl = new Set();
let view = 'search';
function toast(t) {
  const el = $('toast'); el.textContent = t; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 3500);
}
function syncHearts() {
  document.querySelectorAll('.heart').forEach((b) => {
    const on = wl.has(b.dataset.key);
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
    b.setAttribute('aria-label', on ? 'Remove from wishlist' : 'Add to wishlist');
    b.textContent = on ? '\u2665' : '\u2661';
  });
  $('wl-n').textContent = wl.size ? '(' + wl.size + ')' : '';
}
function heartBtn(r) {
  const b = h('button', { class: 'heart', type: 'button', 'data-key': r.key });
  b.onclick = () => toggleWish(r, b);
  return b;
}
function wishEmpty() {
  return h('div', { class: 'state' }, h('h2', null, 'Your Wishlist is empty'),
    h('p', null, 'Save products here to compare them later.'));
}
async function toggleWish(r, btn) {
  const had = wl.has(r.key);
  btn.disabled = true;
  try {
    const res = had ? await fetch('/api/wishlist/' + r.key, { method: 'DELETE' })
                    : await fetch('/api/wishlist', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                     body: JSON.stringify({ key: r.key }) });
    const d = await res.json().catch(() => ({}));
    if (!res.ok) { toast(d.error || 'Could not update your wishlist.'); return; }
    if (had) wl.delete(r.key); else wl.add(r.key);
    syncHearts();
    if (had && view === 'wish') dropWishRow(btn);
  } catch (e) { toast('Could not reach the server. Try again.'); }
  finally { btn.disabled = false; }
}
function dropWishRow(el) {
  const row = el.closest('.row'); if (row) row.remove();
  if (!$('wish-out').querySelector('.row')) $('wish-out').replaceChildren(wishEmpty());
}
function wishActions(r) {
  const rm = h('button', { class: 'rm', type: 'button' }, 'Remove');
  rm.onclick = () => toggleWish(r, rm);
  const when = r.saved_at ? new Date(r.saved_at * 1000).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
  return h('div', { class: 'wact' }, rm,
    h('span', null, 'Saved' + (when ? ' on ' + when : '') + '. Prices shown are from then; search again for current prices.'));
}
async function loadWishlist() {
  const out = $('wish-out');
  out.replaceChildren(h('div', { class: 'skel' }));
  try {
    const r = await fetch('/api/wishlist'); const d = await r.json();
    wl.clear(); d.keys.forEach((k) => wl.add(k));
    out.replaceChildren();
    if (!d.items.length) out.append(wishEmpty()); else d.items.forEach((it) => out.append(renderRow(it, 'wish')));
    syncHearts();
  } catch (e) { out.replaceChildren(h('div', { id: 'msg', class: 'err' }, 'Could not load your wishlist. Try again.')); }
}

/* ---------- history ---------- */
function ago2(ts) {
  const s = Math.max(0, Math.round(Date.now() / 1000 - ts));
  if (s < 90) return 'just now';
  if (s < 3600) return Math.round(s / 60) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + ' h ago';
  return Math.round(s / 86400) + ' d ago';
}
async function loadHistory() {
  const out = $('hist-out'), clr = $('clr');
  out.replaceChildren(h('div', { class: 'skel' })); clr.hidden = true;
  try {
    const r = await fetch('/api/history'); const d = await r.json();
    out.replaceChildren();
    if (!d.items.length) {
      out.append(h('div', { class: 'state' }, h('h2', null, 'No recent searches'),
        h('p', null, 'Your recent product searches will appear here.')));
      return;
    }
    clr.hidden = false;
    const ul = h('ul', { class: 'hl' });
    d.items.forEach((it) => {
      const b = h('button', { type: 'button' }, h('span', null, it.query), h('small', null, ago2(it.searched_at)));
      b.onclick = () => { input.value = it.query; setView('search'); search(false); };
      ul.append(h('li', null, b));
    });
    out.append(ul);
  } catch (e) { out.replaceChildren(h('div', { id: 'msg', class: 'err' }, 'Could not load your history. Try again.')); }
}
$('clr').onclick = async () => {
  if (!confirm('Clear all your recent searches?')) return;
  try { await fetch('/api/history', { method: 'DELETE' }); loadHistory(); }
  catch (e) { toast('Could not clear history. Try again.'); }
};

/* ---------- tabs ---------- */
function setView(v) {
  view = v;
  $('v-search').hidden = v !== 'search'; $('v-wish').hidden = v !== 'wish'; $('v-hist').hidden = v !== 'hist';
  document.querySelectorAll('.tab').forEach((t) => {
    if (t.dataset.view === v) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
  });
  window.scrollTo(0, 0);
  if (v === 'wish') loadWishlist();
  if (v === 'hist') loadHistory();
}
document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => setView(t.dataset.view)));
fetch('/api/wishlist').then((r) => r.json()).then((d) => { d.keys.forEach((k) => wl.add(k)); syncHearts(); }).catch(() => {});

function render(d) {
  status.hidden = false; status.replaceChildren(statusPill('amazon', d.platforms.amazon), statusPill('flipkart', d.platforms.flipkart));
  out.replaceChildren();
  if (!d.results.length) {
    const down = Object.values(d.platforms).some((m) => m.status === 'blocked' || m.status === 'error');
    showMsg(down ? 'No comparable products could be shown because at least one platform was unavailable. Try again, or run the server with PRICEWISE_HEADLESS=0.'
                 : 'No electronic products matched "' + d.query + '". Try a more specific name, such as brand, model and storage.', down);
    return;
  }
  const refresh = h('button', { class: 'ghost', type: 'button' }, 'Fetch live prices again');
  refresh.onclick = () => search(true);
  out.append(h('div', { class: 'sub', style: 'margin-bottom:10px' },
    d.results.length + ' products, ' + d.paired + ' found on both platforms. Prices are the listed prices at fetch time. ', refresh));
  d.results.forEach((r) => out.append(renderRow(r)));
  wl.clear(); (d.wishlist_keys || []).forEach((k) => wl.add(k)); syncHearts();
}

async function search(fresh) {
  const q = input.value.trim();
  if (q.length < 2) return;
  go.disabled = true; go.textContent = 'Checking Amazon and Flipkart...';
  msg.hidden = true; status.hidden = true; out.replaceChildren(h('div', { class: 'skel' }), h('div', { class: 'skel' }), h('div', { class: 'skel' }));
  try {
    const r = await fetch('/api/search?q=' + encodeURIComponent(q) + (fresh ? '&fresh=1' : ''));
    const d = await r.json();
    if (!r.ok) { out.replaceChildren(); showMsg(d.error || 'Search failed.', true); return; }
    render(d);
  } catch (e) {
    out.replaceChildren(); showMsg('Could not reach the PriceWise server. Is app.py still running?', true);
  } finally { go.disabled = false; go.textContent = 'Compare prices'; }
}
form.addEventListener('submit', (e) => { e.preventDefault(); search(false); });
document.querySelectorAll('[data-q]').forEach((b) => b.addEventListener('click', () => { input.value = b.dataset.q; search(false); }));
</script>
</body>
</html>
